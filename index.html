<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Key Vault RBAC Migrator</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230078d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='18' height='18' x='3' y='3' rx='2'/%3E%3Cpath d='M7 7h10'/%3E%3Cpath d='M7 12h10'/%3E%3Cpath d='M7 17h10'/%3E%3C/svg%3E" />

</head>

<body class="bg-neutral-100 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100 antialiased">
  <style>
    /* Custom scrollbar styles for horizontal and vertical scroll */
    .overflow-x-auto::-webkit-scrollbar,
    .overflow-y-auto::-webkit-scrollbar,
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .overflow-x-auto::-webkit-scrollbar-track,
    .overflow-y-auto::-webkit-scrollbar-track,
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f3f2f1;
      border-radius: 4px;
    }

    .overflow-x-auto::-webkit-scrollbar-thumb,
    .overflow-y-auto::-webkit-scrollbar-thumb,
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c8c6c4;
      border-radius: 4px;
    }

    .overflow-x-auto::-webkit-scrollbar-thumb:hover,
    .overflow-y-auto::-webkit-scrollbar-thumb:hover,
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a19f9d;
    }

    /* Dark mode scrollbar */
    .dark .overflow-x-auto::-webkit-scrollbar-track,
    .dark .overflow-y-auto::-webkit-scrollbar-track,
    .dark .custom-scrollbar::-webkit-scrollbar-track {
      background: #323130;
    }

    .dark .overflow-x-auto::-webkit-scrollbar-thumb,
    .dark .overflow-y-auto::-webkit-scrollbar-thumb,
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #605e5c;
    }

    .dark .overflow-x-auto::-webkit-scrollbar-thumb:hover,
    .dark .overflow-y-auto::-webkit-scrollbar-thumb:hover,
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a19f9d;
    }

    /* Firefox scrollbar */
    .overflow-x-auto,
    .overflow-y-auto,
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: #c8c6c4 #f3f2f1;
    }

    .dark .overflow-x-auto,
    .dark .overflow-y-auto,
    .dark .custom-scrollbar {
      scrollbar-color: #605e5c #323130;
    }

    /* Scrollbar-thin utility */
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: #f3f2f1;
      border-radius: 3px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #c8c6c4;
      border-radius: 3px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #a19f9d;
    }

    .dark .scrollbar-thin::-webkit-scrollbar-track {
      background: #323130;
    }

    .dark .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #605e5c;
    }

    .dark .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #a19f9d;
    }

    .scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: #c8c6c4 #f3f2f1;
    }

    .dark .scrollbar-thin {
      scrollbar-color: #605e5c #323130;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
